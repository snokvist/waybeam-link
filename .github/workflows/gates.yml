# SPDX-License-Identifier: GPL-2.0-or-later
#
# Issue #143. Until this existed the repo had no CI at all, and two of its
# gates — the B7 embed check and the install/find_package round trip — exist
# specifically to catch regressions a normal build cannot see. They only ran
# when somebody remembered.
#
# The logic lives in scripts/gates.sh, not here, so `scripts/gates.sh` locally
# and CI cannot drift apart. Toolchains this runner does not have are SKIPPED
# by that script, loudly and counted — never silently passed.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps
        # GStreamer is optional (frame_shm_gst_bench is guarded on pkg-config
        # being present); everything else is vendored under third_party/.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Run gates
        env:
          # The runner ships an NDK; it is generally NOT the 26.3.11579264 that
          # Waybeam-android pins, and the build warns about exactly that. The
          # bionic gate is still worth running — its job is catching
          # portability breaks (nfds_t narrowing was the first), which do not
          # depend on the revision matching. SSC338Q has no public toolchain,
          # so those three presets skip here and stay a local gate.
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./scripts/gates.sh

      - name: Summary
        if: always()
        run: |
          echo "Gates run by scripts/gates.sh. Skipped presets are printed" >> "$GITHUB_STEP_SUMMARY"
          echo "above and counted separately — a skip is not a pass." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Not covered here: SSC338Q cross builds (no public toolchain)" >> "$GITHUB_STEP_SUMMARY"
          echo "and hardware trials (issue #140 — they need a rig, and the TX" >> "$GITHUB_STEP_SUMMARY"
          echo "mode radiates)." >> "$GITHUB_STEP_SUMMARY"
